[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[headers]]
  for = "/owner/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
[[redirects]]
  from = "/private"
  to = "/#more-projects"
  status = 302
[[redirects]]
  from = "/portfolio_gallery.html"
  to = "/#all-projects"
  status = 302
[[redirects]]
  from = "/subpages/buchfix.html"
  to = "/#project/buchfix"
  status = 302
[[redirects]]
  from = "/subpages/loyalty.html"
  to = "/#project/loyalty"
  status = 302
[[redirects]]
  from = "/subpages/niewidomi.html"
  to = "/#project/niewidomi"
  status = 302
